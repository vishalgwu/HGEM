[project]
name = "gateway"
version = "0.0.1"
description = "GuardMem AI Gateway — FastAPI ingress: authN, tenancy, rate limits, propose/commit REST + audit endpoints."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "guardmem-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "authlib>=1.3",
    "redis>=5.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
