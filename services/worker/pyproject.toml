[project]
name = "worker"
version = "0.0.1"
description = "GuardMem AI Worker — arq consumer for async eval, compaction, reindex, digest, SLA sweeper."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "guardmem-core",
    "arq>=0.26",
    "redis>=5.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
