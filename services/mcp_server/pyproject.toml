[project]
name = "mcp-server"
version = "0.0.1"
description = "GuardMem AI MCP server — memory.search, memory.propose, memory.commit, memory.forget, audit, review tools over stdio + streamable HTTP."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "guardmem-core",
    "mcp>=1.0",
    "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
