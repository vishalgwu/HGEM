# Pre-commit gates - BUILD_NOTEBOOK.md S1.2
#
# "If the gates are not in place on day 1, you will not add them on day 15."
#
# Three deviations from S1.2 as written, each deliberate:
#
# 1. REVISIONS ARE CURRENT, NOT THE ONES IN THE NOTEBOOK. S1.2 pins ruff v0.7.0,
#    mypy v1.13.0 and gitleaks v8.21.0. This repo resolved ruff 0.16.6 and mypy
#    2.3.1 on Day 0, and gitleaks is now v8.30.1. Pinning the notebook's values
#    would mean the hook and the CLI disagree about what passes - a lint gate
#    that greenlights code `make lint` rejects is worse than no gate. The ruff
#    rev below is deliberately the same version as the pinned ruff in
#    requirements/dev.txt and pyproject.toml's dev group. Bump all three
#    together or not at all.
#
# 2. mypy AND import-linter RUN AS `local` HOOKS, NOT `mirrors-mypy`.
#    mirrors-mypy installs mypy into its own isolated virtualenv, so it only
#    sees what `additional_dependencies` lists - S1.2 lists `[pydantic]` alone,
#    while guardmem-core already depends on pydantic-settings, httpx, structlog,
#    anyio, numpy and rapidfuzz. The moment real code imports any of those, the
#    hook fails on missing stubs while `make typecheck` passes, and the two
#    drift permanently. Running the project's own mypy means the hook, `make
#    typecheck` and CI are the same command against the same interpreter.
#    import-linter is here for the same reason and because RULES.md 2.4 makes
#    the dependency-direction contract a gate, not a suggestion.
#
# 3. detect-secrets IS ADDED. RULES.md 4 requires "gitleaks + detect-secrets in
#    pre-commit and CI" - S1.2 lists only gitleaks. `.secrets.baseline` already
#    exists from S0.2 precisely so this hook can pass.
#
# Install with `make hooks` (or `uv run pre-commit install`).

minimum_pre_commit_version: "4.0.0"

default_language_version:
  python: python3.12

repos:
  # --- format + lint -------------------------------------------------------
  # `ruff-check`, not `ruff`. S1.2 says `id: ruff`, which this version still
  # accepts but reports as "ruff (legacy alias)"; the two have identical entry
  # points today and there is no reason to adopt a deprecated id on day one.
  #
  # The `extend-exclude` in pyproject.toml IS load-bearing here, contrary to
  # what you might assume from a "Python linter". `ruff-format` declares
  # `types_or: [python, pyi, jupyter, markdown]`, so pre-commit hands it every
  # Markdown file, and both hooks run `--force-exclude` precisely so the
  # exclusion still applies to explicitly-passed paths. Without `*.md` in that
  # exclusion the hook rewrites Python code blocks inside the prose - which for
  # a spec-driven repo means the specification gets edited by the formatter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # --- secret scanning (RULES.md 4) ----------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # detect-secrets runs as a `local` hook purely so it can be forced into
  # Python's UTF-8 mode. It hashes the secret STRING, and it opens files with the
  # interpreter's default encoding - cp1252 on Windows, utf-8 on Linux. Any file
  # containing a non-ASCII byte therefore hashes differently on the two
  # platforms, and the baseline silently stops matching on the other one.
  #
  # That is not theoretical: `docs/MCP_INTEGRATION.md:22` contains the
  # placeholder `gm_live_…` with a UTF-8 ellipsis (e2 80 a6). Windows decoded it
  # as cp1252 `â€¦` and recorded sha1 53b0d961…; Linux decodes it correctly and
  # computes f0f6a8c9…, misses the baseline, and reports an already-reviewed
  # finding as a new secret. That is what failed the first two CI runs.
  #
  # `-X utf8` makes both platforms agree. Regenerate the baseline the same way:
  #     uv run python -X utf8 -m detect_secrets scan --baseline .secrets.baseline
  # and re-normalise the paths afterwards - the scanner writes them with the
  # local separator, which tests/unit/test_secrets_baseline.py rejects.
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: uv run python -X utf8 -m detect_secrets.pre_commit_hook --baseline .secrets.baseline
        language: system
        # The lock files are a wall of hashes; scanning them yields only false
        # positives, and they contain no credentials by construction.
        exclude: ^(requirements\.lock\.txt|uv\.lock|\.secrets\.baseline)$

      # Runs immediately after, because detect-secrets writes result paths with
      # the LOCAL separator every time it updates the baseline - and it updates
      # it whenever a line number shifts in a baselined file. Left alone, an
      # ordinary edit on Windows reintroduces `docs\BUILD_NOTEBOOK.md`, which
      # Linux CI never matches, and tests/unit/test_secrets_baseline.py fails.
      # Repairing that by hand on every commit is a step that eventually gets
      # skipped, on the one file where a careless change allowlists a real
      # secret.
      - id: normalise-secrets-baseline
        name: Normalise .secrets.baseline paths
        entry: uv run python -X utf8 scripts/normalise_secrets_baseline.py
        language: system
        pass_filenames: false
        always_run: true

  # --- type + architecture gates (project toolchain, not an isolated env) ---
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (guardmem-core + tests + scripts)
        # Same arguments as `make typecheck`, deliberately. S1.7 widened that
        # target to `tests` - Protocol is structural, so the conformance of
        # tests/fixtures/fakes.py is only checkable by mypy - and S3.6 widened
        # it again to `scripts`, which is where the seed lives. A hook that kept
        # checking the narrower set would pass locally and fail in CI, which is
        # the drift deviation 2 in this file's header exists to stop; S1.7
        # shipped exactly that bug and needed a follow-up commit to fix it.
        entry: uv run mypy packages/guardmem-core/src tests scripts
        language: system
        pass_filenames: false
        require_serial: true
        # Also trigger on pyproject.toml: the strictness settings live there, so
        # a config change can break typing without any .py file changing.
        files: ^(packages/guardmem-core/src/.*\.py|tests/.*\.py|scripts/.*\.py|pyproject\.toml)$

      - id: lint-imports
        name: import-linter contracts (RULES.md 2.4)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(packages/.*\.py|pyproject\.toml)$
