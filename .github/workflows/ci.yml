# CI - BUILD_NOTEBOOK.md S1.2
#
# Runs the same gates a developer runs locally, through the same Makefile
# targets. That is the point: if CI invoked `ruff`/`mypy`/`pytest` directly, the
# Makefile could drift from CI and nobody would notice until a green local run
# failed here. `make lint && make typecheck && make test` is also the literal
# S1.2 acceptance check.
#
# Four jobs, because they answer different questions:
#   gates  - does the code pass lint, types and the fast tests?
#   integration - do the invariants hold against a real Postgres? Split from
#            `gates` because it pulls a container image and takes minutes rather
#            than seconds, and because a lint failure should not wait on Docker
#            to be reported. Added at S3.2.
#   load   - does the async accept still meet a latency budget under sustained
#            load? Its own job, added at S8.4, because a latency flake must not be
#            able to fail the correctness signal - and because it is the only job
#            that needs a long-running stack rather than per-test containers.
#   hooks  - does the pre-commit config itself work, and is the tree free of
#            secrets? RULES.md 4 requires gitleaks AND detect-secrets in
#            pre-commit *and* CI, and this is where the CI half is satisfied.
#            The heavier scans (trivy, semgrep, pip-audit) get their own
#            security.yml at the step that introduces them - PROJECT_TREE.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same reason as the Makefile: keep tool output encoding identical across
  # platforms so a gate never fails for an encoding reason.
  PYTHONIOENCODING: utf-8
  # Let uv fetch the interpreter .python-version pins rather than using whatever
  # the runner image happens to ship. `never` would be the stricter-sounding
  # value and is wrong here - it disables downloads, so `uv python install`
  # below could not satisfy 3.12 at all.
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  gates:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Action majors are bumped together and deliberately: every run before
      # this one warned that checkout@v4, cache@v4 and setup-uv@v5 target Node
      # 20, which the runners now force onto Node 24. Full-SHA pinning is the
      # hardened form RULES.md 4 would eventually want, but it needs the weekly
      # Dependabot that section also calls for; majors are the honest interim.
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned for the same reason model ids are pinned in RULES.md 3 - a
          # floating toolchain makes a green build unreproducible. Matches the
          # uv recorded in DAILY_LOG.
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Distinct per job. Both jobs run in parallel and would otherwise
          # derive the same cache key, so whichever finishes second cannot
          # reserve it and every run carries "Failed to save: Unable to reserve
          # cache ... another job may be creating this cache". Harmless, but a
          # warning that fires every time is one people learn to scroll past,
          # and this cache is a few MB.
          cache-suffix: gates

      - name: Install Python 3.12
        # Reads .python-version, which pins 3.12 so the lock, the venv and
        # ruff's target-version all agree.
        run: uv python install

      - name: Install the workspace
        # `uv sync` is EXACT - it installs precisely the lock and nothing else.
        # pyproject.toml warns against running it locally, where it would
        # uninstall ~300 packages that come from requirements.lock.txt. That
        # warning does not apply here: this environment is created fresh on
        # every run, so there is nothing to destroy, and exactness is what makes
        # the build reproducible.
        #
        # `--locked` is the gate: it fails if uv.lock is out of date with
        # pyproject.toml, so a dependency edit that was never re-locked cannot
        # merge.
        #
        # `--group bench` because `make typecheck` covers `bench/`, which imports
        # `locust`. Without it mypy fails on a missing import here while passing on
        # any machine that installed from requirements.lock.txt - which is what
        # happened on the first run of the `load` job.
        run: uv sync --locked --dev --group bench

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        # Unit, property and contract - no containers. The integration suite is
        # its own job below; see `make test` vs `make test-all` in the Makefile.
        run: make test

  integration:
    name: integration (testcontainers Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `RULES.md` §5: the integration suite is green with no skips on main. That
    # sentence had nothing enforcing it until S3.2, because the tests skipped
    # whenever no database was reachable and a runner never has one. They now
    # start their own - `tests/fixtures/postgres.py` runs the pinned pgvector
    # image, mounts the repository's real `infra/docker/initdb/` into it, and
    # applies the schema with `alembic upgrade head`. No `services:` block, for
    # that reason: a service container would be a second, hand-written copy of
    # the dev stack, and the point is to exercise the one that ships.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: integration

      - name: Install Python 3.12
        run: uv python install

      - name: Install the workspace
        run: uv sync --locked --dev

      - name: Create .env from the example
        # The migration is applied by `alembic upgrade head`, and `env.py` reads
        # its URL from `Settings` - which has nine required fields, of which the
        # DSN is one. The fixture overrides `GM_DATABASE_URL` for the container
        # it just started; the other eight still have to come from somewhere,
        # and on a developer's machine they come from `.env`.
        #
        # This is the README's own "Local setup" line, run verbatim, which makes
        # it a check on that instruction as well as a prerequisite for this job.
        # The `gates` job needs no such step: unit tests build `Settings`
        # explicitly rather than reading the environment.
        run: cp .env.example .env

      - name: Pre-pull the container images
        # Outside the test timeout, and separately visible in the log. A 620 MB
        # pull that fails inside a fixture reads as a mysterious timeout;
        # failing here says "the registry was unreachable", which is what
        # happened.
        #
        # Redis joined at S8.3, whose token bucket is a Lua script and so cannot be
        # tested against a fake, and Neo4j at S7.1 - it was never listed here, so
        # its pull ran inside a fixture. Every image is `tests/fixtures/containers.py`'s
        # exact pin, and `test_compose_stack.py` asserts this list matches it: the
        # first version pulled `redis:7-alpine`, a tag that floats.
        run: |
          docker pull pgvector/pgvector:0.8.6-pg16
          docker pull neo4j:5.26.30-community
          docker pull redis:7.4-alpine

      - name: Test
        # Through the Makefile, like every other gate in this file - see the
        # header. `make test-integration`, not `make test-all`: the pgvector
        # fixture is what this job exists to exercise, and the unit and property
        # suites already ran in `gates`.
        run: make test-integration

  load:
    name: load (async propose p95)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # S8.4's DONE WHEN: "locust run at 50 rps shows p95 < 80 ms on the async propose
    # endpoint". That 80ms is `PRD.md` 6.1's production SLA and this job does NOT gate
    # on it - see `bench/profiles/p95_targets.yaml`. A runner is two shared vCPUs with
    # Redis in a container beside it; a gate at the SLA would fail for the runner's
    # reasons and be switched off within a week, which is worse than no gate. What this
    # gates on is an order-of-magnitude regression, and it has a real one to catch: the
    # six stacked `BaseHTTPMiddleware` layers S8.4 removed measured p95 440ms.
    #
    # Separate from `integration` on purpose. That job answers whether the invariants
    # hold; this one answers how fast, and a slow runner must not be able to make the
    # first question look like it failed.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: load

      - name: Install Python 3.12
        run: uv python install

      - name: Install the workspace
        # `--group bench` is what puts `locust` in the environment. It is pinned in
        # `requirements/evals.txt` for the inventory's sake, and that file does not
        # reach `uv.lock` - so the group is how CI gets it.
        run: uv sync --locked --dev --group bench

      - name: Create .env from the example
        # The gateway reads `Settings`, which has nine required fields. The template's
        # DSNs point at localhost:5432 and localhost:6379, which is exactly what the
        # dev stack below publishes - so this is also a check that the two agree.
        run: cp .env.example .env

      - name: Start Postgres and Redis
        # The repository's own compose file, not a `services:` block. `ci.yml` already
        # rejects that for the integration job - "a service container would be a
        # second, hand-written copy of the dev stack, and the point is to exercise the
        # one that ships" - and the same applies here.
        #
        # Two services by name rather than the whole file: Neo4j and Phoenix are large
        # images and the async accept touches neither.
        run: docker compose -f infra/docker/docker-compose.dev.yml up -d --wait postgres redis

      - name: Apply the schema
        # `make migrate`, so this exercises the same path a developer runs. The async
        # accept does not read Postgres - it validates and enqueues - but the gateway's
        # lifespan opens a pool and `/readyz` probes it, so an unmigrated database would
        # start and then fail the readiness check below for a confusing reason.
        run: make migrate

      - name: Start the gateway
        # Backgrounded rather than a step of its own, because a server is not a step: it
        # has to outlive one. The log goes to a file that the failure path uploads, since
        # a gateway that refused to start leaves nothing in this step's own output.
        #
        # The rate limit is raised for the run. At 50 rps the default 60/min would refuse
        # almost everything, and a 429 is cheaper than the work being measured - so the
        # p95 would look excellent and mean nothing. `write_path.py` fails the run on any
        # failed sample for the same reason.
        env:
          GM_GATEWAY_API_KEYS: '{"ci-load-key":{"tenant":"11111111-1111-4111-8111-111111111111","scopes":["memory:read","memory:write"]}}'
          GM_RATE_LIMIT_PER_MINUTE: "100000"
          GM_RATE_LIMIT_BURST: "100000"
        run: |
          uv run uvicorn gateway.main:app --port 8000 --log-level warning > gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -m 2 http://127.0.0.1:8000/readyz; then echo; exit 0; fi
            sleep 2
          done
          echo "gateway did not become ready"; cat gateway.log; exit 1

      - name: Load test the async propose path
        # Through the Makefile, like every other gate in this file. The threshold lives
        # in `bench/profiles/p95_targets.yaml` and is enforced by the script's own
        # `quitting` listener, so the verdict is in one place rather than in a shell
        # comparison here.
        env:
          # The `*_API_KEY` name trips the keyword detector whatever the value is, so
          # this is marked rather than renamed to dodge the scanner - the same call
          # `fixtures/mcp.py` makes for its unused Neo4j password. It is not a
          # credential: it is the literal string the step above configures the gateway
          # to accept, valid only inside this job, on a container destroyed with it.
          GM_BENCH_API_KEY: ci-load-key  # pragma: allowlist secret
        run: make bench-write

      - name: Upload the gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-log
          path: gateway.log
          if-no-files-found: ignore

  hooks:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        # Full history: gitleaks is far more useful when it can see more than
        # the tip commit.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: hooks

      - name: Install Python 3.12
        run: uv python install

      - name: Install the workspace
        run: uv sync --locked --dev

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Run every hook
        run: uv run pre-commit run --all-files --show-diff-on-failure
