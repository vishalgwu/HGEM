# CI - BUILD_NOTEBOOK.md S1.2
#
# Runs the same gates a developer runs locally, through the same Makefile
# targets. That is the point: if CI invoked `ruff`/`mypy`/`pytest` directly, the
# Makefile could drift from CI and nobody would notice until a green local run
# failed here. `make lint && make typecheck && make test` is also the literal
# S1.2 acceptance check.
#
# Three jobs, because they answer different questions:
#   gates  - does the code pass lint, types and the fast tests?
#   integration - do the invariants hold against a real Postgres? Split from
#            `gates` because it pulls a container image and takes minutes rather
#            than seconds, and because a lint failure should not wait on Docker
#            to be reported. Added at S3.2.
#   hooks  - does the pre-commit config itself work, and is the tree free of
#            secrets? RULES.md 4 requires gitleaks AND detect-secrets in
#            pre-commit *and* CI, and this is where the CI half is satisfied.
#            The heavier scans (trivy, semgrep, pip-audit) get their own
#            security.yml at the step that introduces them - PROJECT_TREE.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same reason as the Makefile: keep tool output encoding identical across
  # platforms so a gate never fails for an encoding reason.
  PYTHONIOENCODING: utf-8
  # Let uv fetch the interpreter .python-version pins rather than using whatever
  # the runner image happens to ship. `never` would be the stricter-sounding
  # value and is wrong here - it disables downloads, so `uv python install`
  # below could not satisfy 3.12 at all.
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  gates:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Action majors are bumped together and deliberately: every run before
      # this one warned that checkout@v4, cache@v4 and setup-uv@v5 target Node
      # 20, which the runners now force onto Node 24. Full-SHA pinning is the
      # hardened form RULES.md 4 would eventually want, but it needs the weekly
      # Dependabot that section also calls for; majors are the honest interim.
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned for the same reason model ids are pinned in RULES.md 3 - a
          # floating toolchain makes a green build unreproducible. Matches the
          # uv recorded in DAILY_LOG.
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Distinct per job. Both jobs run in parallel and would otherwise
          # derive the same cache key, so whichever finishes second cannot
          # reserve it and every run carries "Failed to save: Unable to reserve
          # cache ... another job may be creating this cache". Harmless, but a
          # warning that fires every time is one people learn to scroll past,
          # and this cache is a few MB.
          cache-suffix: gates

      - name: Install Python 3.12
        # Reads .python-version, which pins 3.12 so the lock, the venv and
        # ruff's target-version all agree.
        run: uv python install

      - name: Install the workspace
        # `uv sync` is EXACT - it installs precisely the lock and nothing else.
        # pyproject.toml warns against running it locally, where it would
        # uninstall ~300 packages that come from requirements.lock.txt. That
        # warning does not apply here: this environment is created fresh on
        # every run, so there is nothing to destroy, and exactness is what makes
        # the build reproducible.
        #
        # `--locked` is the gate: it fails if uv.lock is out of date with
        # pyproject.toml, so a dependency edit that was never re-locked cannot
        # merge.
        run: uv sync --locked --dev

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        # Unit and property only. The integration suite is its own job below -
        # see `make test` vs `make test-all` in the Makefile.
        run: make test

  integration:
    name: integration (testcontainers Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `RULES.md` §5: the integration suite is green with no skips on main. That
    # sentence had nothing enforcing it until S3.2, because the tests skipped
    # whenever no database was reachable and a runner never has one. They now
    # start their own - `tests/fixtures/postgres.py` runs the pinned pgvector
    # image, mounts the repository's real `infra/docker/initdb/` into it, and
    # applies the schema with `alembic upgrade head`. No `services:` block, for
    # that reason: a service container would be a second, hand-written copy of
    # the dev stack, and the point is to exercise the one that ships.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: integration

      - name: Install Python 3.12
        run: uv python install

      - name: Install the workspace
        run: uv sync --locked --dev

      - name: Create .env from the example
        # The migration is applied by `alembic upgrade head`, and `env.py` reads
        # its URL from `Settings` - which has nine required fields, of which the
        # DSN is one. The fixture overrides `GM_DATABASE_URL` for the container
        # it just started; the other eight still have to come from somewhere,
        # and on a developer's machine they come from `.env`.
        #
        # This is the README's own "Local setup" line, run verbatim, which makes
        # it a check on that instruction as well as a prerequisite for this job.
        # The `gates` job needs no such step: unit tests build `Settings`
        # explicitly rather than reading the environment.
        run: cp .env.example .env

      - name: Pre-pull the database image
        # Outside the test timeout, and separately visible in the log. A 620 MB
        # pull that fails inside a fixture reads as a mysterious timeout;
        # failing here says "the registry was unreachable", which is what
        # happened.
        run: docker pull pgvector/pgvector:0.8.6-pg16

      - name: Test
        run: uv run pytest tests/integration -q

  hooks:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        # Full history: gitleaks is far more useful when it can see more than
        # the tip commit.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: hooks

      - name: Install Python 3.12
        run: uv python install

      - name: Install the workspace
        run: uv sync --locked --dev

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Run every hook
        run: uv run pre-commit run --all-files --show-diff-on-failure
