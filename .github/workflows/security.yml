name: security

# Pre-alpha: security scanning is opt-in until real source code lands.
# Turn back on `push` / `pull_request` / `schedule` triggers once the core
# engine and services have real dependencies to audit.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.20"
      - name: pip-audit
        run: |
          uv sync --all-packages --dev
          uv run pip-audit --strict

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci p/python p/typescript
