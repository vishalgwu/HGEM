[project]
name = "guardmem"
version = "0.0.1"
description = "GuardMem AI SDK for Python — remember(), recall(), forget() with drop-in agent middleware."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "anyio>=4.4",
]

[project.optional-dependencies]
langchain  = ["langchain>=0.2"]
llamaindex = ["llama-index>=0.10"]
crewai     = ["crewai>=0.36"]
langgraph  = ["langgraph>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardmem"]
