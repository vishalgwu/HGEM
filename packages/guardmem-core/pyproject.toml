[project]
name = "guardmem-core"
version = "0.1.0"
description = "GuardMem AI decision engine - extraction, validation, scoring, decision, audit."
requires-python = ">=3.12"
# ARCHITECTURE.md 2.2: this package runs identically in the gateway (strict
# mode), the worker (async mode) and the eval harness, which is why it carries
# no web-framework dependency. PROJECT_TREE.md pins that as a hard rule and the
# import-linter contract in the root pyproject.toml enforces it.
#
# These are exactly the dependencies S1.1 calls for. One more is listed under
# requirements/base.txt as part of this package's eventual runtime and enters
# here at the step that first needs it:
#     tenacity  S9.3  jittered backoff on retryable errors
# Adding it now would be scaffolding a dependency ahead of its use. `pyyaml`
# left that list at S3.5, the step that loads the ontology - which is also the
# step `prompts/loader.py` named when it explained why its frontmatter parser
# is hand-rolled rather than a YAML call.
dependencies = [
  # --- imported today ------------------------------------------------------
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "rapidfuzz>=3.10",
  # --- DECLARED AND NOT YET IMPORTED ---------------------------------------
  # These four are S1.1's list and every one of them is unused by the package
  # as it stands. They are kept deliberately, each annotated with the step that
  # makes it real, because an audit that finds an unimported dependency and
  # cannot tell "not needed yet" from "no longer needed" removes the wrong one.
  # Re-check this block whenever one of those steps lands: a dependency that is
  # still unused two steps after its owner shipped is genuinely dead.
  #
  # `structlog` S13.1 observability. RULES.md 6: structured JSON logging only,
  #                   every line carrying trace_id, tenant_id and namespace.
  # `anyio`     S9.1  CPU-bound work off the event loop. RULES.md 2.2 routes it
  #                   through anyio.to_thread, and S9.1's local embedder is the
  #                   first such work the package owns.
  #                   RETAGGED FROM S4.3, per this block's own re-check rule.
  #                   S4.3 shipped and did not import it: the step chose a
  #                   BALANCED-tier LLM judge, which is a network call, and
  #                   deferred the local cross-encoder ("swap in a local
  #                   cross-encoder in week 2 if latency demands it"). That
  #                   cross-encoder still needs this, behind the NLIJudge
  #                   protocol, but "week 2" is not a step id and S9.1 is the
  #                   nearer honest one. Kept, not removed.
  "structlog>=24.4",
  "anyio>=4.6",
  # --- model providers, imported today -------------------------------------
  # S9.1. `llm/providers/` is the first code in this package to call a model at
  # all - until it landed, CHECKPOINT B was BLOCKED and `memory.propose`
  # declined, both for want of an `LLMClient` implementation.
  #
  # Both vendor SDKs rather than raw HTTP: each owns its own retry policy,
  # connection handling and typed exception hierarchy, and reimplementing those
  # over `httpx` would be three of the four done worse. `requirements/llm.txt`
  # pins the same two and says why Ollama is the exception - "Ollama needs no
  # SDK - it is called over its HTTP API with httpx", which is what `httpx`
  # below is now imported for.
  #
  # Pinned exactly rather than floored, matching `requirements/llm.txt`: a
  # provider SDK is the one dependency whose minor releases change request
  # shapes, and `anthropic` 1.4.0 dropping `temperature` from `messages.create`
  # is the example this step ran into.
  "anthropic==1.4.0",
  "openai==3.11.0",
  # S9.1. The Ollama adapter speaks its HTTP API directly. Moved out of the
  # deferred block above by the guard in
  # tests/unit/test_dependency_consistency.py, which is the rule that block
  # states about itself - and which fired on the first run of this step.
  #
  # Plain `httpx`, not `httpx2`: both vendor SDKs are built on `httpx2` and own
  # their own transports, and the two never meet.
  "httpx>=0.27",
  # --- numerics, imported today --------------------------------------------
  # S5.1. `pipeline/l3_score/entropy.py` takes MEMORY_ENGINE.md 3.1's entropy
  # over cluster sizes. Moved out of the deferred block above the moment it
  # was imported, which is the rule that block states about itself - and the
  # guard in tests/unit/test_dependency_consistency.py is what noticed.
  # CHECKPOINT B is the larger consumer: AUROC of C over 200 labelled
  # candidates, which is the gate that decides whether Day 6 happens.
  "numpy>=2.1",
  # --- store drivers, imported today ---------------------------------------
  # S3.2. PROJECT_TREE's ownership table lets this layer import "store
  # drivers", and `memory/vector/pgvector_store.py` is the first module that
  # does. Not sqlalchemy: the store speaks asyncpg directly, and sqlalchemy
  # belongs to the migration toolchain on the workspace root.
  "asyncpg>=0.31",
  "pgvector>=0.5",
  # S3.4. The dev and single-tenant graph backend (`PROJECT_TREE.md`), and the
  # first `GraphStore` implementation - `requirements/stores.txt` says "build
  # this one first". Neo4j arrives at S7.1 behind the same protocol and is NOT
  # listed here: a driver nothing imports is scaffolding.
  "networkx>=3.4",
  # S3.5. The ontology starter packs are YAML (`MEMORY_ENGINE.md` §2.1) and
  # `schemas/ontology.py` is the first module in this package to read one.
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
