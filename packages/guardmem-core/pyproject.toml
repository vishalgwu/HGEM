[project]
name = "guardmem-core"
version = "0.0.1"
description = "GuardMem AI decision engine — pipeline, guardrails, memory router, LLM router, audit chain. Zero web-framework deps."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anyio>=4.4",
    "structlog>=24.1",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "tenacity>=8.3",
]

[project.optional-dependencies]
pgvector = ["asyncpg>=0.29", "pgvector>=0.3"]
qdrant   = ["qdrant-client>=1.9"]
neo4j    = ["neo4j>=5.20"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
opa      = ["opa-python-client>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardmem_core"]
