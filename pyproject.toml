# uv workspace root — actual runtime dependencies live in per-package pyproject.toml.

[project]
name = "guardmem-ai"
version = "0.0.1"
description = "Memory governance gateway for AI agents — scores every write, routes the ambiguous middle to a human, keeps a hash-chained audit trail."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "GuardMem AI contributors" }]

[tool.uv.workspace]
members = [
    "packages/guardmem-core",
    "packages/guardmem-sdk-python",
    "services/gateway",
    "services/worker",
    "services/mcp_server",
]

[tool.uv.sources]
guardmem-core = { workspace = true }
guardmem     = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "schemathesis>=3.30",
]

# ─── Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "C4", "TCH", "ANN"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"evals/**" = ["S", "ANN"]

# ─── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_unimported = true

# ─── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires docker-compose.dev.yml stack",
    "slow: takes >2s to run",
    "eval: part of the eval suite",
]

# ─── import-linter (enforces layering) ───────────────────────────────
[tool.importlinter]
root_packages = ["guardmem_core", "gateway", "worker", "mcp_server"]

[[tool.importlinter.contracts]]
name = "guardmem-core has no web-framework deps"
type = "forbidden"
source_modules = ["guardmem_core"]
forbidden_modules = ["fastapi", "starlette", "mcp"]

[[tool.importlinter.contracts]]
name = "services do not import each other"
type = "independence"
modules = ["gateway", "worker", "mcp_server"]
