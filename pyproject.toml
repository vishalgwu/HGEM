[project]
name = "guardmem-workspace"
version = "0.1.0"
requires-python = ">=3.12"
# The workspace root depends on guardmem-core so that it is actually installed
# into the environment. `[tool.uv.sources]` below only says WHERE to resolve the
# package from - it does not pull it in on its own. Without this line the S1.1
# acceptance check, `uv run python -c "import guardmem_core"`, fails with
# ModuleNotFoundError.
dependencies = [
  "guardmem-core",
  # Migration toolchain, owned by the workspace rather than by the library.
  # `infra/migrations/` is not a package and nothing under `guardmem_core`
  # imports these yet: S3.2's pgvector store is the step that adds sqlalchemy,
  # asyncpg and pgvector to `packages/guardmem-core/pyproject.toml`, where the
  # PROJECT_TREE ownership table already permits "store drivers". Pinned to the
  # same versions `requirements/stores.txt` cites for S3.1, because the two
  # artifacts have to agree - see tests/unit/test_dependency_consistency.py.
  "alembic==1.19.2",
  "sqlalchemy==2.0.52",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
guardmem-core = { workspace = true }

# Dev toolchain (BUILD_NOTEBOOK.md S1.1, extended at S1.2).
#
# These are EXACT pins, not floors, and they mirror requirements/dev.txt line
# for line. S1.1 wrote floors (`pytest>=8.3`), which let `uv lock` resolve a
# different version than the one requirements/dev.txt pins - and it did:
# testcontainers resolved to 4.15.0 here while requirements pinned 4.13.3. The
# result was an environment that flipped between the two depending on whether
# `uv run` (syncs to uv.lock) or `uv pip install -r requirements.lock.txt` ran
# last, with no error either way. Pinning here makes uv.lock agree with
# requirements/, so both artifacts describe the same environment.
#
# Adding or bumping a dev tool means editing BOTH this list and
# requirements/dev.txt, then `uv lock`. That is deliberate: requirements/dev.txt
# carries the per-entry citation of the step or RULES clause that requires each
# package, which a machine-generated export would throw away.
[dependency-groups]
dev = [
  # test
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.168.0",
  "respx==0.23.1",
  # NO extras here, deliberately. requirements/dev.txt declares
  # testcontainers[postgres,neo4j,redis] because that is what the integration
  # suite will need from S1.3 - but pulling those extras into the WORKSPACE lock
  # today drags the store drivers in with them, and `testcontainers[redis]`
  # resolves redis to 8.1.0 while requirements/stores.txt pins 5.3.1 on purpose
  # (arq 0.28.0 constrains redis<6; see the Day 0 log). That would silently undo
  # the arq decision on the next `uv sync`. Verified with `uv sync --dry-run`:
  # "- redis==5.3.1 / + redis==8.1.0". Add the extras at the step that first
  # runs a testcontainer, and pin redis in the same commit.
  "testcontainers==4.13.3",
  "pytest-xdist==3.8.0",
  # lint / type / architecture
  "ruff==0.16.6",
  "mypy==2.3.1",
  "import-linter==2.15",
  # Stub-only distribution, and the reason this list must MIRROR
  # requirements/dev.txt rather than approximate it. It was pinned there and
  # not here, so it was absent from uv.lock and therefore from CI - where
  # `mypy --strict` then failed on `tests/unit/test_compose_stack.py`'s
  # `import yaml` from S1.7 onward, the step that widened `make typecheck` to
  # cover `tests`. Locally it passed, because requirements.lock.txt installs it.
  "types-pyyaml==6.0.12.20260906",
  # The second stub-only distribution, added at S3.2 for the same reason the
  # first one had to be repaired: `asyncpg` now ships inside
  # `packages/guardmem-core`, so `mypy --strict` checks a module that talks to
  # it, and the `ignore_missing_imports` override below turned every connection,
  # record and pool into `Any`. S3.1 deferred this on the belief that
  # regenerating `requirements.lock.txt` would drag seventeen unrelated packages
  # forward. Measured at S3.2: it moves nothing. `uv pip compile` honours the
  # pins already in its output file, so the seventeen were an artefact of
  # resolving from scratch. The deferral was right to be cautious and wrong
  # about the fact.
  "asyncpg-stubs==0.31.0",
  # gates (S1.2) - RULES.md 4 puts secret scanning in pre-commit AND CI
  "pre-commit==4.6.2",
  "detect-secrets==1.5.0",
  "pip-audit==2.10.1",
  # Suites whose steps have not arrived, mirrored anyway. A tool that is in
  # requirements/dev.txt and not in the lock is a tool CI does not have, and the
  # only way to know which of those matters is to have been bitten by one.
  "schemathesis==4.26.1",
  "jsonschema==4.26.0",
  "mutmut==3.7.0",
]

# ---------------------------------------------------------------------------
# ruff - lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

# Markdown is specification prose, not source. Modern ruff formats Python code
# blocks *inside* Markdown, so without this exclusion `make lint` fails on the
# design suite and `ruff format .` silently rewrites it - collapsing the aligned
# NewType block in BUILD_NOTEBOOK.md S1.5, among others. The specs are the
# source of truth for the code, not the other way round.
#
# S1.2 widened this from ["docs"] to include every .md. The docs/ entry alone
# left the ROOT markdown unprotected - README, DAILY_LOG, CHANGELOG,
# CONTRIBUTING, SECURITY - and the ruff-format pre-commit hook declares
# `types_or: [python, pyi, jupyter, markdown]`, so it receives those files and
# reformats the Python inside them. Verified by probe: a deliberately misformatted
# block in a root .md is rewritten even with --force-exclude, while the same
# block under docs/ is skipped. No root .md has a python fence today, which is
# the only reason this had not bitten yet. Illustrative code in prose is often
# *deliberately* not canonical - a snippet showing what NOT to do must stay
# wrong.
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E","F","I","N","UP","B","C4","ASYNC","S","T20","SIM","RUF","C901"]
ignore = ["S101"]          # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
# scripts/ holds command-line tools - the pre-commit baseline normaliser today,
# and seed_demo_tenant / replay_trace / threshold_tuner as their steps arrive.
# T20 bans `print` because RULES.md 6 requires structured logging in the
# application; for a CLI, stdout IS the interface, and a hook that logged JSON
# to a file instead would be useless to the developer reading its output.
# S (flake8-bandit) stays ON here - these run in CI and touch the repo.
"scripts/*" = ["T20"]
# N818 wants every exception class to end in `Error`. These seven do not, and
# that is not an oversight: RULES.md 2.3 names them, the notebook says to copy
# that hierarchy verbatim, and `code`/`http_status`/`mcp_code` are a published
# contract that the class names sit alongside. Renaming them to satisfy a
# naming convention would put the code and the spec of record out of step, and
# RULES.md 8 is explicit that when those disagree the code is what is wrong.
# The names also read better for what they are - `PolicyDenied` is an outcome,
# not a malfunction. The base class is still `GuardMemError`, so the suffix
# convention holds where it carries meaning.
"packages/guardmem-core/src/guardmem_core/errors.py" = ["N818"]

# Without this, ruff's isort classifies `guardmem_core` as third-party - it is
# installed editable, so it looks like any other site-packages distribution -
# and interleaves it alphabetically among pytest/pydantic. That is not merely
# cosmetic: PROJECT_TREE's ownership model is about dependency DIRECTION, and
# it should be legible at the top of every file which imports are ours and
# which are the outside world. Surfaced by the first module to import the
# package (tests/unit/test_settings.py at S1.4).
[tool.ruff.lint.isort]
# `conftest` and `fixtures` are our own shared test modules, not distributions.
# Without them here isort groups them with yaml/pytest, which reads as though
# they came from PyPI - and `fixtures` in particular is a plausible package name
# on the index, so the misfiling is easy to miss.
known-first-party = ["guardmem_core", "conftest", "fixtures"]

# RULES.md 2.4 caps cyclomatic complexity at 10. Ruff's default happens to be
# 10, but relying on a tool default for a documented engineering gate is how
# gates quietly change under you.
[tool.ruff.lint.mccabe]
max-complexity = 10

# RULES.md 2.2 and 2.3 name two "custom ruff rules", GM001 (`except: pass`
# around a guardrail) and GM002 (an outbound call with no timeout). Ruff has no
# plugin system, so no such custom rule can exist - but both are already covered
# by stock rules that the `S` and `ASYNC` selectors above enable:
#     GM001  ->  S110  try-except-pass        (+ E722 bare-except)
#     GM002  ->  S113  request-without-timeout
# Verified present in ruff 0.16.6. Do not write custom rules for these.

# ---------------------------------------------------------------------------
# mypy - strict on the core package
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# `testcontainers` ships no `py.typed` and has no stub package. Unlike the
# `asyncpg` case below, nothing here is worth chasing: the import is confined to
# `tests/fixtures/postgres.py`, the only value taken from it is a container
# handle whose host and port are immediately turned into a `str` DSN, and the
# library is test scaffolding rather than something the product depends on.
[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

# `asyncpg` ships no `py.typed`, so it is typed from `asyncpg-stubs` in the dev
# group. There is deliberately NO `ignore_missing_imports` override for it: that
# is what S3.1 used as a stopgap, and it does not merely silence the import - it
# makes every connection, record and pool `Any`, which turns `--strict` off for
# exactly the code that talks to the database. S3.2 moved `asyncpg` into
# `guardmem-core` itself, so that trade stopped being acceptable.

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
# fail_under is 85, the Week-1 interim floor. RULES.md 5 sets the release gate
# at 90 on guardmem-core, and this number rises before the Phase 1 exit gate is
# signed off. branch = true is not optional: RULES.md 5 requires 100% BRANCH
# coverage on the decision branches in pipeline/, guardrails/ and
# memory/router.py, which line coverage alone cannot measure.
[tool.coverage.run]
branch = true
source_pkgs = ["guardmem_core"]

[tool.coverage.report]
fail_under = 85
show_missing = true
# Protocol method bodies are `...` and are never executed - nothing calls a
# Protocol, that is the point of structural typing. Without this they report as
# uncovered from S1.7 on, which would either push the gate below its floor or,
# worse, teach everyone to read a number that is not about the code. Their
# conformance is verified by `mypy --strict` over `tests/`, which is a stronger
# check than coverage could give. Scoped to a bare `...` on its own line, so it
# cannot silently excuse a real body.
exclude_also = ["^\\s*\\.\\.\\.$"]

# ---------------------------------------------------------------------------
# import-linter - dependency direction
# ---------------------------------------------------------------------------
# PROJECT_TREE.md "Ownership & Dependency Rules" and RULES.md 2.4 both require
# these contracts; S1.1 never actually specified them. Only the contracts that
# are meaningful today are declared - the layered contract (apps -> services ->
# packages -> stores) arrives when services/ and apps/ do.
[tool.importlinter]
root_packages = ["guardmem_core"]
# Required whenever a contract forbids modules outside the root packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "guardmem-core imports no web framework"
type = "forbidden"
source_modules = ["guardmem_core"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "mcp", "arq"]

# ---------------------------------------------------------------------------
# A note on pyproject vs requirements/
# ---------------------------------------------------------------------------
# Two dependency artifacts exist in this repo and they serve different jobs:
#
#   pyproject.toml + uv.lock   authoritative for the workspace packages. Ranges
#                              here, exact pins in the lock. This is what
#                              RULES.md 2 means by "uv for env/lock".
#   requirements/*.txt         the human-readable inventory, where every entry
#                              cites the step or spec clause that requires it,
#                              plus requirements.lock.txt for a plain
#                              pip-compatible install.
#
# SETTLED AT S1.2: both are kept, and they agree by construction. The
# [dependency-groups] block above now carries EXACT pins mirroring
# requirements/dev.txt, so `uv lock` cannot resolve a different version than the
# requirements files pin. Before that they had already drifted - testcontainers
# was 4.15.0 in uv.lock and 4.13.3 in requirements - and the environment flipped
# between them depending on which command ran last, silently. Bumping a dev tool
# now means editing both files and re-running `uv lock`.
#
# WARNING - do not run bare `uv sync` in a LOCAL checkout. `uv sync` is exact: it
# removes every package not in the lock, which locally would uninstall roughly
# 300 of the 313 installed packages (fastapi, presidio, phoenix, the whole dev
# toolchain) because those come from requirements.lock.txt and are deliberately
# not workspace dependencies. `uv run` is inexact and safe - it installs what is
# missing and leaves extras alone. Verified both behaviours on uv 0.9.8.
#
# CI is the exception, and .github/workflows/ci.yml uses `uv sync` on purpose.
# There the environment is created fresh on every run, so there is nothing to
# uninstall, and exactness is precisely what you want from a build that has to
# be reproducible. The warning above is about protecting a populated developer
# machine, not about `uv sync` being wrong.
