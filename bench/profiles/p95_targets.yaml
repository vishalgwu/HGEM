# The latency targets a load run is measured against.  PRD.md 6.1
#
# One file rather than numbers inside each locust script, because `PRD.md` 6.1 owns
# these and a target restated at the point of measurement is a target that can
# disagree with its own spec. A run reads this; it does not carry its own copy.
#
# Milliseconds throughout. `PRD.md` writes the eval path in seconds and the rest in
# milliseconds; one unit here means a comparison never needs a conversion, and a
# conversion at the point of assertion is how a p95 gets compared against a p50.
targets:
  # S8.4's DONE WHEN: "locust run at 50 rps shows p95 < 80 ms on the async propose
  # endpoint". The write-ahead accept - ADR-0003 - so this measures validation,
  # authentication, the rate-limit round trip and the enqueue, and deliberately not
  # the governing, which happens on the worker.
  propose_async:
    rps: 50
    p50_ms: 25
    p95_ms: 80
    p99_ms: 150
    # What CI gates on, which is deliberately NOT `p95_ms`.
    #
    # `p95_ms` is a production SLA measured on real hardware. A GitHub runner is two
    # shared vCPUs with a neighbour, and Redis is a container on the same box - so a
    # gate at 80 ms there would fail for the runner's reasons and be switched off
    # within a week, which is worse than no gate.
    #
    # This number exists to catch an order-of-magnitude regression. It has one: the
    # six stacked `BaseHTTPMiddleware` layers S8.4 removed measured p95 440 ms on a
    # machine faster than a runner, and 400 catches that with room to spare.
    #
    # **Provisional until the first runs are read.** Chosen from a Windows measurement
    # and a guess at how a Linux runner differs. Tighten it once several green runs
    # show the real distribution - a gate four times looser than reality only catches
    # disasters.
    p95_ci_ms: 500

    # **The gate that actually discriminates, and the reason there are two.** Three
    # consecutive local runs gave p95 260, 290 and 340 ms - about 30% spread, against a
    # broken-state p95 of 440. A p95 gate tight enough to catch 440 would sit inside
    # that spread and flake, and a flaky gate gets switched off.
    #
    # The median is far steadier: 120, 130, 140 ms across the same three runs, against
    # 330 ms with the six `BaseHTTPMiddleware` layers in place. That is a 2.5x gap with
    # low variance, which is what a regression gate needs. 250 catches the regression
    # with margin and leaves the current median about 45% of headroom.
    #
    # So `p95_ci_ms` is the outer rail and this is the detector. Both are enforced.
    p50_ci_ms: 250

  # mode=strict, K=1 on the fast tier. Not part of S8.4's DONE WHEN and recorded
  # because the number exists: a single fast-tier extraction, so it is dominated by
  # one model round trip and is a measurement of the provider as much as of this code.
  propose_strict:
    p50_ms: 180
    p95_ms: 450
    p99_ms: 900

  # Read path. Measured at 10M vectors in the spec; a dev database holds far fewer, so
  # a green number here is a floor rather than evidence.
  search:
    p50_ms: 30
    p95_ms: 80
    p99_ms: 160
