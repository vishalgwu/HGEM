# The latency targets a load run is measured against.  PRD.md 6.1
#
# One file rather than numbers inside each locust script, because `PRD.md` 6.1 owns
# these and a target restated at the point of measurement is a target that can
# disagree with its own spec. A run reads this; it does not carry its own copy.
#
# Milliseconds throughout. `PRD.md` writes the eval path in seconds and the rest in
# milliseconds; one unit here means a comparison never needs a conversion, and a
# conversion at the point of assertion is how a p95 gets compared against a p50.
targets:
  # S8.4's DONE WHEN: "locust run at 50 rps shows p95 < 80 ms on the async propose
  # endpoint". The write-ahead accept - ADR-0003 - so this measures validation,
  # authentication, the rate-limit round trip and the enqueue, and deliberately not
  # the governing, which happens on the worker.
  propose_async:
    rps: 50
    p50_ms: 25
    p95_ms: 80
    p99_ms: 150

  # mode=strict, K=1 on the fast tier. Not part of S8.4's DONE WHEN and recorded
  # because the number exists: a single fast-tier extraction, so it is dominated by
  # one model round trip and is a measurement of the provider as much as of this code.
  propose_strict:
    p50_ms: 180
    p95_ms: 450
    p99_ms: 900

  # Read path. Measured at 10M vectors in the spec; a dev database holds far fewer, so
  # a green number here is a floor rather than evidence.
  search:
    p50_ms: 30
    p95_ms: 80
    p99_ms: 160
