name: guardmem-test

# Ephemeral stack used by `make integration` / CI. No volumes — everything is
# torn down after the run.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: guardmem_test
      POSTGRES_USER: guardmem
      POSTGRES_PASSWORD: guardmem
    tmpfs: [/var/lib/postgresql/data]
    ports: ["55432:5432"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/guardmem
    tmpfs: [/data]
    ports: ["57687:7687"]

  redis:
    image: redis:7-alpine
    tmpfs: [/data]
    ports: ["56379:6379"]
